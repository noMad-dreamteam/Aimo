Читай только нужные модули и тесты. Если меняется общий контракт, сначала сообщи root. Отчёт: результат, файлы, команды проверок, риски.
По умолчанию только чтение приложения. Владение: docs/TEST_PLAN.md и назначенные тесты. Перед правкой production-кода получи назначение root. Указывай шаги, ожидаемое/фактическое поведение и источник измерений; не выдавай имитацию за камеру.
"""
